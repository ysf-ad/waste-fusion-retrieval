version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.pi
    ports:
      - "80:80"
    environment:
      # People detection settings
      - CAPTURE_DELAY=2              # Seconds to wait after person detected before capturing
      - DETECTION_COOLDOWN=10        # Seconds between captures to avoid spam
      - PEOPLE_DETECTION_THRESHOLD=0.5  # Confidence threshold (0-1)
      # API endpoint for waste classification
      - API_ENDPOINT=https://api.biswa.ca/predict
    devices:
      # Camera access (on Raspberry Pi)
      - /dev/video0:/dev/video0
      - /dev/vchiq:/dev/vchiq
    # Required for camera access
    privileged: true
    volumes:
      # For camera memory access
      - /sys:/sys
    restart: unless-stopped
